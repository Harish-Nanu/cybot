[project]
name = "cybot"
version = "0.1.0"
description = "Cybersecurity threat analysis & response agent: alert ingestion/normalization + agentic RAG risk assessment"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "httpx>=0.27",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=3.0"]

[project.scripts]
cybot = "cybot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
