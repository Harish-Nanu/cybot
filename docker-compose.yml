services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment to use an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${CYBOT_OLLAMA_MODEL:-llama3.1:8b}"]
    restart: "no"

  cybot:
    build: .
    depends_on:
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    environment:
      CYBOT_OLLAMA_BASE_URL: http://ollama:11434
      CYBOT_OLLAMA_MODEL: ${CYBOT_OLLAMA_MODEL:-llama3.1:8b}
      CYBOT_API_KEY: ${CYBOT_API_KEY:-}
      # Optional threat-intel providers; each is enabled when its key is set.
      CYBOT_ABUSEIPDB_API_KEY: ${CYBOT_ABUSEIPDB_API_KEY:-}
      CYBOT_VIRUSTOTAL_API_KEY: ${CYBOT_VIRUSTOTAL_API_KEY:-}
      CYBOT_GREYNOISE_API_KEY: ${CYBOT_GREYNOISE_API_KEY:-}
      CYBOT_URLHAUS_API_KEY: ${CYBOT_URLHAUS_API_KEY:-}
      # Response actions are simulated unless set to "live" with a webhook URL.
      CYBOT_RESPONSE_MODE: ${CYBOT_RESPONSE_MODE:-dry_run}
      CYBOT_RESPONSE_WEBHOOK_URL: ${CYBOT_RESPONSE_WEBHOOK_URL:-}
      CYBOT_RESPONSE_WEBHOOK_SECRET: ${CYBOT_RESPONSE_WEBHOOK_SECRET:-}
    volumes:
      - cybot-data:/app/data
    ports:
      - "8000:8000"

volumes:
  ollama-models:
  cybot-data:
